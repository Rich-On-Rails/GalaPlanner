name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'no-release') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-release') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'ci') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'chore') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'wip')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out merged commit and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          labels="$(jq -r '.[] | ascii_downcase' <<<"$PR_LABELS")"
          bump=patch
          if grep -Eqx 'release:major|semver:major|major' <<<"$labels"; then
            bump=major
          elif grep -Eqx 'release:minor|semver:minor|minor' <<<"$labels"; then
            bump=minor
          fi

          latest="$(git tag --list 'v*' --sort=-v:refname |
            grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          current="${latest#v}"
          current="${current:-0.0.0}"
          IFS=. read -r major minor patch <<<"$current"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Verify build
        run: npm run build

      - name: Package build artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p release-artifacts
          tar -czf "release-artifacts/source-${tag}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='release-artifacts' \
            .
          tar -czf "release-artifacts/frontend-dist-${tag}.tar.gz" -C packages/frontend dist
          tar -czf "release-artifacts/backend-dist-${tag}.tar.gz" -C packages/backend dist
          tar -czf "release-artifacts/shared-dist-${tag}.tar.gz" -C packages/shared dist

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: gala-planner-${{ steps.version.outputs.version }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release and version tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gala Planner ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
          files: release-artifacts/*.tar.gz
